<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Name Generator</title>
</head>
<body>
    <h1>Band Name Generator</h1>
    <form action="/submit" method="POST">
        <label for="street">Street Name:</label>
        <input type="text" name="street" placeholder="Street Name" required>
        <label for="pet">Pet Name:</label>
        <input type="text" name="pet" placeholder="Pet Name" required>
        <button type="submit">Generate Band Name</button>
    </form>
</body>
</html>
